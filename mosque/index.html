<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2fbf5">
    <meta name="description" content="قصه‌ها، آموزش‌ها و نوای شیعی برای بچه‌ها در مسجد کوچولوها">
    <title>مسجد کوچولوها</title>
    <link rel="stylesheet" href="styles.css?v=1">
    <script src="app.js?v=1" defer></script>
  </head>
  <body>
    <div class="sky-shape sky-shape-one" aria-hidden="true"></div>
    <div class="sky-shape sky-shape-two" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="صفحهٔ اصلی مسجد کوچولوها">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 7c-8.5 0-15.5 6.9-15.5 15.5S15.5 38 24 38c5.3 0 10-2.7 12.8-6.8a13 13 0 0 1-7.3 2.2c-7.2 0-13-5.8-13-13 0-5.7 3.7-10.6 8.8-12.3A16 16 0 0 0 24 7Z" fill="currentColor"/>
            <path d="m35.2 10 .9 2.3 2.4.2-1.8 1.6.5 2.3-2-1.2-2 1.2.5-2.3-1.8-1.6 2.4-.2.9-2.3Z" fill="#F5B942"/>
          </svg>
        </span>
        <span>مسجد کوچولوها</span>
      </a>
      <span class="top-note">جایی برای یاد گرفتن و مهربانی</span>
    </header>

    <main class="page-shell">
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-copy">
          <p class="eyebrow"><span aria-hidden="true">✦</span> سلام به دوستای خوب مسجد!</p>
          <h1 id="welcomeTitle">سلام، <span>قهرمان کوچولو</span>!</h1>
          <p class="welcome-text">با هم قصه می‌بینیم، چیزهای خوب یاد می‌گیریم و مهربان‌تر می‌شویم.</p>
        </div>
        <div class="mosque-art" aria-hidden="true">
          <span class="art-sun"></span>
          <span class="art-star star-one">✦</span>
          <span class="art-star star-two">✦</span>
          <div class="art-mosque">
            <span class="minaret minaret-left"><i></i></span>
            <span class="dome dome-left"></span>
            <span class="dome dome-main"></span>
            <span class="dome dome-right"></span>
            <span class="mosque-body"><i></i></span>
            <span class="minaret minaret-right"><i></i></span>
          </div>
        </div>
      </section>

      <nav class="filters" aria-label="دسته‌بندی محتوا">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">همه</button>
        <button class="filter-chip" type="button" data-filter="learn" aria-pressed="false">یاد بگیریم</button>
        <button class="filter-chip" type="button" data-filter="story" aria-pressed="false">قصه‌ها</button>
        <button class="filter-chip" type="button" data-filter="talk" aria-pressed="false">پند و گفتار</button>
        <button class="filter-chip" type="button" data-filter="maddahi" aria-pressed="false">نوای حسینی</button>
      </nav>

      <section class="library" id="library" aria-label="برنامه‌های مسجد">
        <button class="content-card lesson-card" type="button" data-item="mosque-adab" data-category="learn" aria-label="باز کردن آداب مسجد">
          <span class="card-art art-adab" aria-hidden="true"><span class="art-emoji">🕌</span><span class="art-spark">✦</span></span>
          <span class="card-copy"><span class="card-tag">یاد بگیریم</span><span class="card-title">آداب مسجد</span><span class="card-subtitle">سه کار کوچک برای یک مسجد قشنگ</span></span>
          <span class="card-arrow" aria-hidden="true">‹</span>
        </button>

        <button class="content-card" type="button" data-item="salah" data-category="learn" aria-label="پخش انیمیشن نماز در مسجد">
          <span class="card-art art-prayer" aria-hidden="true"><span class="art-emoji">🌙</span><span class="art-caption">نماز در مسجد</span></span>
          <span class="card-copy"><span class="card-tag">انیمیشن آموزشی</span><span class="card-title">نماز در مسجد</span><span class="card-subtitle">با هم یک قصهٔ خوب ببینیم</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="amanat" data-category="story" aria-label="پخش قصهٔ امانت‌داری">
          <span class="card-art art-kindness" aria-hidden="true"><span class="art-emoji">🤝</span><span class="art-caption">قصهٔ امانت‌داری</span></span>
          <span class="card-copy"><span class="card-tag">قصهٔ اهل‌بیت</span><span class="card-title">امانت‌داری</span><span class="card-subtitle">یک داستان آموزنده از امام علی (ع)</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="good-morals" data-category="story" aria-label="پخش داستان اخلاقی نیکوکاری">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/20628.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">داستان کارتونی</span><span class="card-title">داستان نیکوکاری</span><span class="card-subtitle">کار خوب، دل‌ها را شاد می‌کند</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="respect" data-category="learn" aria-label="پخش آموزش احترام به بزرگ‌ترها">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/20849.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">یاد بگیریم</span><span class="card-title">احترام به بزرگ‌ترها</span><span class="card-subtitle">یک برنامهٔ کودکانه به زبان فارسی</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="prophet-advice" data-category="talk" aria-label="پخش پندهایی از پیامبر">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/17813.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">پند و گفتار</span><span class="card-title">پندهایی از پیامبر (ص)</span><span class="card-subtitle">یک برنامهٔ کودکانه به زبان فارسی</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="noha" data-category="maddahi" aria-label="پخش نوای کودکانهٔ حسینی">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/556.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">نوای کودکانه</span><span class="card-title">نوای حسینی</span><span class="card-subtitle">هم‌خوانی کودکانه به زبان فارسی</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>
      </section>
    </main>

    <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
      <header class="viewer-bar">
        <button class="close-viewer" id="closeViewer" type="button" aria-label="بستن برنامه">×</button>
        <h2 id="viewerTitle"></h2>
        <span class="viewer-mark" aria-hidden="true">✦</span>
      </header>
      <div class="viewer-content" id="viewerContent"></div>
    </section>

    <footer class="site-footer"><span aria-hidden="true">☾</span> مسجد کوچولوها <span class="footer-dot">•</span> با هم مهربان‌تر می‌شویم</footer>
  </body>
</html>
