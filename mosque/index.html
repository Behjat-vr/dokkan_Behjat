<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2fbf5">
    <meta name="description" content="قصص وتعاليم وأناشيد شيعية للأطفال في مسجد الصغار">
    <title>مسجد الصغار</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="app.js?v=2" defer></script>
  </head>
  <body>
    <div class="sky-shape sky-shape-one" aria-hidden="true"></div>
    <div class="sky-shape sky-shape-two" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="الصفحة الرئيسية لمسجد الصغار">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 7c-8.5 0-15.5 6.9-15.5 15.5S15.5 38 24 38c5.3 0 10-2.7 12.8-6.8a13 13 0 0 1-7.3 2.2c-7.2 0-13-5.8-13-13 0-5.7 3.7-10.6 8.8-12.3A16 16 0 0 0 24 7Z" fill="currentColor"/>
            <path d="m35.2 10 .9 2.3 2.4.2-1.8 1.6.5 2.3-2-1.2-2 1.2.5-2.3-1.8-1.6 2.4-.2.9-2.3Z" fill="#F5B942"/>
          </svg>
        </span>
        <span>مسجد الصغار</span>
      </a>
      <span class="top-note">مكان للتعلّم واللطف</span>
    </header>

    <main class="page-shell">
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-copy">
          <p class="eyebrow"><span aria-hidden="true">✦</span> مرحبًا يا أصدقاء المسجد!</p>
          <h1 id="welcomeTitle">مرحبًا، <span>أيها البطل الصغير</span>!</h1>
          <p class="welcome-text">نشاهد القصص ونتعلّم أشياء جميلة ونصبح ألطف معًا.</p>
        </div>
        <div class="mosque-art" aria-hidden="true">
          <span class="art-sun"></span>
          <span class="art-star star-one">✦</span>
          <span class="art-star star-two">✦</span>
          <div class="art-mosque">
            <span class="minaret minaret-left"><i></i></span>
            <span class="dome dome-left"></span>
            <span class="dome dome-main"></span>
            <span class="dome dome-right"></span>
            <span class="mosque-body"><i></i></span>
            <span class="minaret minaret-right"><i></i></span>
          </div>
        </div>
      </section>

      <nav class="filters" aria-label="تصنيفات المحتوى">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">الكل</button>
        <button class="filter-chip" type="button" data-filter="learn" aria-pressed="false">لنتعلّم</button>
        <button class="filter-chip" type="button" data-filter="story" aria-pressed="false">القصص</button>
        <button class="filter-chip" type="button" data-filter="talk" aria-pressed="false">حِكم وكلمات</button>
        <button class="filter-chip" type="button" data-filter="maddahi" aria-pressed="false">نشيد حسيني للأطفال</button>
      </nav>

      <section class="library" id="library" aria-label="أنشطة المسجد">
        <button class="content-card lesson-card" type="button" data-item="mosque-adab" data-category="learn" aria-label="فتح آداب المسجد">
          <span class="card-art art-adab" aria-hidden="true"><span class="art-emoji">🕌</span><span class="art-spark">✦</span></span>
          <span class="card-copy"><span class="card-tag">لنتعلّم</span><span class="card-title">آداب المسجد</span><span class="card-subtitle">ثلاث عادات جميلة في المسجد</span></span>
          <span class="card-arrow" aria-hidden="true">‹</span>
        </button>

        <button class="content-card" type="button" data-item="salah" data-category="learn" aria-label="تشغيل رسوم الصلاة في المسجد">
          <span class="card-art art-prayer" aria-hidden="true"><span class="art-emoji">🌙</span><span class="art-caption">الصلاة في المسجد</span></span>
          <span class="card-copy"><span class="card-tag">رسوم تعليمية</span><span class="card-title">الصلاة في المسجد</span><span class="card-subtitle">رسوم تعليمية باللغة الفارسية</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="amanat" data-category="story" aria-label="تشغيل قصة الأمانة">
          <span class="card-art art-kindness" aria-hidden="true"><span class="art-emoji">🤝</span><span class="art-caption">قصة الأمانة</span></span>
          <span class="card-copy"><span class="card-tag">قصص أهل البيت</span><span class="card-title">الأمانة</span><span class="card-subtitle">قصة تعليمية باللغة الفارسية عن الإمام علي (ع)</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="good-morals" data-category="story" aria-label="تشغيل قصة عن الإحسان">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/20628.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">قصة كرتونية</span><span class="card-title">قصة عن الإحسان</span><span class="card-subtitle">قصة عن العمل الطيب باللغة الفارسية</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="respect" data-category="learn" aria-label="تشغيل درس احترام الكبار">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/20849.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">لنتعلّم</span><span class="card-title">احترام الكبار</span><span class="card-subtitle">برنامج للأطفال باللغة الفارسية</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="prophet-advice" data-category="talk" aria-label="تشغيل كلمات من النبي">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/17813.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">حِكم وكلمات</span><span class="card-title">كلمات من النبي (ص)</span><span class="card-subtitle">برنامج للأطفال باللغة الفارسية</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>

        <button class="content-card" type="button" data-item="noha" data-category="maddahi" aria-label="تشغيل النشيد الحسيني للأطفال">
          <span class="card-art poster-image" aria-hidden="true"><img src="https://cdn-thumb.webianos.com/thumbnails/556.jpg" alt="" loading="lazy"><span class="art-shade"></span></span>
          <span class="card-copy"><span class="card-tag">نشيد للأطفال</span><span class="card-title">نشيد حسيني للأطفال</span><span class="card-subtitle">إنشاد جماعي للأطفال باللغة الفارسية</span></span>
          <span class="play-dot" aria-hidden="true">▶</span>
        </button>
      </section>
    </main>

    <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
      <header class="viewer-bar">
        <button class="close-viewer" id="closeViewer" type="button" aria-label="إغلاق النشاط">×</button>
        <h2 id="viewerTitle"></h2>
        <span class="viewer-mark" aria-hidden="true">✦</span>
      </header>
      <div class="viewer-content" id="viewerContent"></div>
    </section>

    <footer class="site-footer"><span aria-hidden="true">☾</span> مسجد الصغار <span class="footer-dot">•</span> لنكن ألطف معًا</footer>
  </body>
</html>
