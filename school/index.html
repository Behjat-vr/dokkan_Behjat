<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff7e8">
    <meta name="description" content="درس‌ها و بازی‌های علمی برای بچه‌های کنجکاو">
    <title>مدرسهٔ کوچولوها</title>
    <link rel="stylesheet" href="styles.css?v=1">
    <script src="app.js?v=1" defer></script>
  </head>
  <body>
    <div class="decoration decor-one" aria-hidden="true">✦</div>
    <div class="decoration decor-two" aria-hidden="true">●</div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="صفحهٔ اصلی مدرسهٔ کوچولوها">
        <span class="brand-icon" aria-hidden="true">✏️</span>
        <span>مدرسهٔ کوچولوها</span>
      </a>
      <span class="top-note">هر روز، یک کشف تازه!</span>
    </header>

    <main class="page-shell">
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-copy">
          <p class="eyebrow"><span aria-hidden="true">☀️</span> سلام دانشمند کوچولو!</p>
          <h1 id="welcomeTitle">آماده‌ای <span>چیزی کشف کنی؟</span></h1>
          <p class="welcome-text">بازی کن، یاد بگیر و جواب‌های تازه پیدا کن.</p>
          <a class="start-link" href="#activities">بزن بریم <span aria-hidden="true">←</span></a>
        </div>
        <div class="welcome-art" aria-hidden="true">
          <span class="art-star star-a">✦</span>
          <span class="art-star star-b">✧</span>
          <span class="art-book">📚</span>
          <span class="art-pencil">✏️</span>
          <span class="art-sun"></span>
        </div>
      </section>

      <div class="section-heading" id="activities">
        <div>
          <h2>کلاس‌های امروز</h2>
          <p>یکی را انتخاب کن و شروع کن!</p>
        </div>
        <span class="tiny-doodle" aria-hidden="true">✦</span>
      </div>

      <nav class="filters" aria-label="دسته‌بندی فعالیت‌ها">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">همه</button>
        <button class="filter-chip" type="button" data-filter="lesson" aria-pressed="false">درس‌ها</button>
        <button class="filter-chip" type="button" data-filter="science" aria-pressed="false">بازی‌های علمی</button>
      </nav>

      <section class="activities" id="activityGrid" aria-label="درس‌ها و بازی‌ها">
        <button class="activity-card card-math" type="button" data-activity="math" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🔢</span><i>+</i></span>
          <span class="card-info"><span class="card-label">درس و بازی</span><span class="card-title">ریاضیِ شیرین</span><span class="card-note">جمع‌های کوچولو</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-letters" type="button" data-activity="words" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">📖</span><i>ب</i></span>
          <span class="card-info"><span class="card-label">فارسی</span><span class="card-title">حرف گمشده</span><span class="card-note">کلمه‌ها را کامل کن</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-english" type="button" data-activity="english" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🐱</span><i>ABC</i></span>
          <span class="card-info"><span class="card-label">زبان انگلیسی</span><span class="card-title">کلمه‌های رنگی</span><span class="card-note">چند واژهٔ ساده یاد بگیر</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-space" type="button" data-activity="space" data-category="science">
          <span class="card-art"><span aria-hidden="true">🪐</span><i>✦</i></span>
          <span class="card-info"><span class="card-label">علوم</span><span class="card-title">سفر به فضا</span><span class="card-note">سیاره‌ها را بشناس</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-float" type="button" data-activity="float" data-category="science">
          <span class="card-art"><span aria-hidden="true">🧪</span><i>💧</i></span>
          <span class="card-info"><span class="card-label">آزمایشگاه</span><span class="card-title">شناور یا غرق؟</span><span class="card-note">حدس بزن و کشف کن</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-pattern" type="button" data-activity="pattern" data-category="science">
          <span class="card-art"><span aria-hidden="true">🔺</span><i>🔵</i></span>
          <span class="card-info"><span class="card-label">فکر و کشف</span><span class="card-title">الگوی عجیب</span><span class="card-note">شکل بعدی را پیدا کن</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-world" type="button" data-activity="world" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🌍</span><i>☁️</i></span>
          <span class="card-info"><span class="card-label">جغرافیا</span><span class="card-title">خانهٔ حیوان‌ها</span><span class="card-note">هرکدام کجا زندگی می‌کند؟</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>
      </section>
    </main>

    <section class="game-viewer" id="gameViewer" role="dialog" aria-modal="true" aria-labelledby="gameTitle" hidden>
      <header class="game-bar">
        <button class="close-game" id="closeGame" type="button" aria-label="بستن بازی">×</button>
        <h2 id="gameTitle"></h2>
        <span class="game-progress" id="gameProgress"></span>
      </header>
      <div class="game-content" id="gameContent"></div>
    </section>

    <footer class="site-footer"><span aria-hidden="true">🌈</span> یاد گرفتن، یک ماجرای قشنگ است!</footer>
  </body>
</html>
