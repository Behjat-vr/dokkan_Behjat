<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff7e8">
    <meta name="description" content="دروس وألعاب علمية للأطفال الفضوليين">
    <title>مدرسة الصغار</title>
    <link rel="stylesheet" href="styles.css?v=juicy-2">
    <script src="app.js?v=5" defer></script>
  </head>
  <body>
    <div class="decoration decor-one" aria-hidden="true">✦</div>
    <div class="decoration decor-two" aria-hidden="true">●</div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="الصفحة الرئيسية لمدرسة الصغار">
        <span class="brand-icon" aria-hidden="true">✏️</span>
        <span>مدرسة الصغار</span>
      </a>
      <span class="top-note">اكتشاف جديد كل يوم!</span>
    </header>

    <main class="page-shell">
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-copy">
          <p class="eyebrow"><span aria-hidden="true">☀️</span> مرحبًا أيها العالِم الصغير!</p>
          <h1 id="welcomeTitle">هل أنت مستعد <span>لاكتشاف شيء جديد؟</span></h1>
          <p class="welcome-text">العب وتعلّم واكتشف إجابات جديدة.</p>
          <a class="start-link" href="#activities">هيا نبدأ <span aria-hidden="true">←</span></a>
        </div>
        <div class="welcome-art" aria-hidden="true">
          <span class="art-star star-a">✦</span>
          <span class="art-star star-b">✧</span>
          <span class="art-book">📚</span>
          <span class="art-pencil">✏️</span>
          <span class="art-sun"></span>
        </div>
      </section>

      <div class="section-heading" id="activities">
        <div>
          <h2>أنشطة اليوم</h2>
          <p>اختر نشاطًا وابدأ!</p>
        </div>
        <span class="tiny-doodle" aria-hidden="true">✦</span>
      </div>

      <nav class="filters" aria-label="تصنيفات الأنشطة">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">الكل</button>
        <button class="filter-chip" type="button" data-filter="lesson" aria-pressed="false">الدروس</button>
        <button class="filter-chip" type="button" data-filter="science" aria-pressed="false">ألعاب علمية</button>
      </nav>

      <section class="activities" id="activityGrid" aria-label="الدروس والألعاب">
        <button class="activity-card card-math" type="button" data-activity="math" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🔢</span><i>+</i></span>
          <span class="card-info"><span class="card-label">درس ولعب</span><span class="card-title">رياضيات ممتعة</span><span class="card-note">عمليات جمع بسيطة</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-letters" type="button" data-activity="words" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">📖</span><i>أ</i></span>
          <span class="card-info"><span class="card-label">اللغة العربية</span><span class="card-title">الحرف المفقود</span><span class="card-note">أكمل الكلمات</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-english" type="button" data-activity="english" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🐱</span><i>ABC</i></span>
          <span class="card-info"><span class="card-label">اللغة الإنجليزية</span><span class="card-title">كلمات جديدة</span><span class="card-note">تعلّم كلمات بسيطة</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-space" type="button" data-activity="space" data-category="science">
          <span class="card-art"><span aria-hidden="true">🪐</span><i>✦</i></span>
          <span class="card-info"><span class="card-label">علوم</span><span class="card-title">رحلة إلى الفضاء</span><span class="card-note">تعرّف على الكواكب</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-float" type="button" data-activity="float" data-category="science">
          <span class="card-art"><span aria-hidden="true">🧪</span><i>💧</i></span>
          <span class="card-info"><span class="card-label">المختبر</span><span class="card-title">يطفو أم يغرق؟</span><span class="card-note">توقّع واكتشف</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-pattern" type="button" data-activity="pattern" data-category="science">
          <span class="card-art"><span aria-hidden="true">🔺</span><i>🔵</i></span>
          <span class="card-info"><span class="card-label">فكّر واكتشف</span><span class="card-title">النمط الغامض</span><span class="card-note">اكتشف الشكل التالي</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>

        <button class="activity-card card-world" type="button" data-activity="world" data-category="lesson">
          <span class="card-art"><span aria-hidden="true">🌍</span><i>☁️</i></span>
          <span class="card-info"><span class="card-label">الجغرافيا</span><span class="card-title">موطن الحيوانات</span><span class="card-note">أين يعيش كل حيوان؟</span></span>
          <span class="card-play" aria-hidden="true">▶</span>
        </button>
      </section>
    </main>

    <section class="game-viewer" id="gameViewer" role="dialog" aria-modal="true" aria-labelledby="gameTitle" hidden>
      <header class="game-bar">
        <button class="close-game" id="closeGame" type="button" aria-label="إغلاق اللعبة">×</button>
        <h2 id="gameTitle"></h2>
        <span class="game-progress" id="gameProgress"></span>
      </header>
      <div class="game-content" id="gameContent"></div>
    </section>

    <footer class="site-footer"><span aria-hidden="true">🌈</span> التعلّم مغامرة جميلة!</footer>
  </body>
</html>
